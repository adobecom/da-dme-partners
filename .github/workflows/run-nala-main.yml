name: DME-Partners Nala Tests

on:
  pull_request:
    types: [ labeled, synchronize, reopened ]
  push:
    branches:
      - main

jobs:
  action:
    name: Running E2E & IT
    if: |
      github.event_name == 'push' ||
      github.event.label.name == 'run-on-dme-main' ||
      (github.event.action == 'synchronize' && contains(join(github.event.pull_request.labels.*.name, ','), 'run-on-dme-main')) ||
      (github.event.action == 'reopened' && contains(join(github.event.pull_request.labels.*.name, ','), 'run-on-dme-main'))
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3
      - name: Run Nala
        uses: adobecom/dme-partners@main
        env:
          labels: ${{ '@dme-main' }}
          branch: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}
          repoName: ${{ github.repository }}
          prUrl: ${{ github.event_name == 'push' && format('{0}/{1}', github.server_url, github.repository) || github.event.pull_request.head.repo.html_url }}
          prOrg: ${{ github.event_name == 'push' && github.repository_owner || github.event.pull_request.head.repo.owner.login }}
          prRepo: ${{ github.event_name == 'push' && github.event.repository.name || github.event.pull_request.head.repo.name }}
          prBranch: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}
          prBaseBranch: ${{ github.event_name == 'push' && 'main' || github.event.pull_request.base.ref }}
          IMS_EMAIL: ${{ secrets.IMS_EMAIL }}
          IMS_PASS: ${{ secrets.IMS_PASS }}
          MILO_AEM_API_KEY: ${{ secrets.MILO_AEM_API_KEY }}
